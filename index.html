<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>七夕快乐 ❤</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0b14; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  #app { width:100%; height:100%; position:relative; }

  /* ===== 开场 ===== */
  #cover { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:radial-gradient(circle at 50% 30%, #1a1030 0%, #0b0b14 70%);
    transition:opacity 1.2s ease; }
  #cover .title { font-size:19vw; font-weight:800; color:#fff; letter-spacing:.08em;
    background:linear-gradient(180deg,#ffd76e,#ff6b9d); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 8px 40px rgba(255,120,160,.4); }
  @media(min-width:480px){ #cover .title{ font-size:90px; } }
  #cover .sub { margin-top:8px; color:#ffd0e0; font-size:14px; letter-spacing:.3em; opacity:.85; }
  #cover .enter { margin-top:30px; padding:22px 72px; border-radius:50px; border:1px solid rgba(255,255,255,.5);
    background:linear-gradient(135deg,rgba(255,107,157,.35),rgba(255,214,110,.25)); color:#fff; font-size:24px; letter-spacing:.25em; cursor:pointer;
    backdrop-filter:blur(8px); transition:all .3s; user-select:none; font-weight:700;
    box-shadow:0 10px 40px rgba(255,120,160,.35); }
  #cover .enter:active { transform:scale(.95); background:rgba(255,255,255,.18); }
  #cover .hint { position:absolute; bottom:30px; color:rgba(255,255,255,.4); font-size:12px; letter-spacing:.15em; }

  /* ===== 烟花画布（覆盖层） ===== */
  #fireworks { position:absolute; inset:0; z-index:40; pointer-events:none; }

  /* ===== 操场主场景 ===== */
  #stage { position:absolute; inset:0; z-index:10; display:none; overflow:hidden; }
  /* 背景阶段纯色 */
  #bg { position:absolute; inset:0; background:#0b0b14; }  /* 底色 */
  #bgSlide { position:absolute; top:0; left:0; right:0; height:60%; }  /* 自然风光只占上方 60%，下方留给跑道 */
  #bgSlide .slide { position:absolute; inset:0; background-position:center 30%; background-size:cover;
    opacity:0; transition:opacity 2.5s ease; }
  #bgSlide .slide.on { opacity:1; }
  #bgStage { position:absolute; top:0; left:0; right:0; height:60%; z-index:2; display:flex; align-items:center; justify-content:center; }
  #bgStage.phaseText { display:none; }
  #phaseText { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  #phaseLabel { font-size:10vw; font-weight:800; color:#fff; letter-spacing:.15em; opacity:.9;
    text-shadow:0 6px 30px rgba(0,0,0,.45); text-align:center; padding:0 6vw; line-height:1.3; }
  @media(min-width:480px){ #phaseLabel{ font-size:52px; } }
  #phaseSub { font-size:.32em; font-weight:400; letter-spacing:.3em; opacity:.7; margin-top:10px; color:#fff; text-shadow:0 4px 20px rgba(0,0,0,.4); }

  /* 操场地面 + 跑道（占下方 40%，与上方自然风光严格上下分区） */
  #ground { position:absolute; left:0; right:0; bottom:0; height:40%; }
  #grass { display:none; }  /* 已由真实跑道图替换，不再需要 */
  /* 真实塑胶田径跑道：铺满整个下方 40%，顶部与上方自然风光无缝衔接 */
  #track { position:absolute; inset:0;
    background:url('https://images.unsplash.com/photo-1502904550040-7534597429ae?auto=format&fit=crop&w=1400&q=80') center/100% 100% no-repeat; }
  /* 跑道横向移动层 */
  #runLayer { position:absolute; left:0; right:0; bottom:12%; height:44%; will-change:transform; }

  /* 跑道上的照片 */
  .ph { position:absolute; bottom:0; width:150px; will-change:transform;
    background:#fff; border-radius:10px; padding:8px 8px 6px; box-shadow:0 10px 24px rgba(0,0,0,.35);
    transform-origin:50% 100%; }
  .ph .img { width:100%; aspect-ratio:4/3; border-radius:6px; background:#eee center/cover no-repeat; }
  .ph .cap { margin-top:6px; text-align:center; font-size:11px; color:#333; line-height:1.4; }
  .ph .cap b { display:block; font-size:10px; color:#c0392b; letter-spacing:.05em; }
  .ph .cap span { font-size:9px; color:#666; }

  /* 阶段角标 */
  #miniStage { position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.45); color:#fff; padding:6px 16px; border-radius:20px; font-size:13px;
    letter-spacing:.12em; backdrop-filter:blur(4px); z-index:5; }

  /* ===== 交互控制栏 ===== */
  #ctrl { position:absolute; left:0; right:0; bottom:0; z-index:20;
    background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0)); padding:14px 14px 22px; }
  #ctrl .row { display:flex; align-items:center; gap:12px; }
  #progress { flex:1; height:5px; background:rgba(255,255,255,.25); border-radius:3px; position:relative; cursor:pointer; }
  #barFill { height:100%; width:0; background:linear-gradient(90deg,#ff6b9d,#ffd76e); border-radius:3px; }
  #timeTxt { color:#fff; font-size:11px; min-width:74px; text-align:center; opacity:.9; }
  .ctrlBtn { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff;
    width:40px; height:40px; border-radius:50%; font-size:16px; cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; transition:.2s; user-select:none; }
  .ctrlBtn:active { transform:scale(.92); background:rgba(255,255,255,.3); }
  #btnPause { width:48px; height:48px; font-size:18px; }

  #editHint { position:absolute; top:60px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.55);
    font-size:11px; letter-spacing:.08em; background:rgba(0,0,0,.3); padding:4px 12px; border-radius:14px; z-index:6; white-space:nowrap; }

  /* ===== 照片数据编辑面板 ===== */
  #editPanel { position:absolute; inset:0; z-index:60; background:rgba(10,10,20,.94); display:none;
    flex-direction:column; padding:20px; }
  #editPanel .head { display:flex; align-items:center; justify-content:space-between; color:#fff; margin-bottom:14px; }
  #editPanel .head h3 { font-size:16px; letter-spacing:.1em; }
  #editPanel .close { color:#ff9db9; font-size:15px; cursor:pointer; padding:4px 8px; }
  #editList { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #editList .eitem{ padding:10px; margin:6px 0; border-radius:10px; background:rgba(255,255,255,.06); transition:background .2s, box-shadow .2s; }
  #editList .eitem.swap-sel{ background:rgba(255,210,77,.20); box-shadow:0 0 0 2px #ffd24d; }
  #editList .eitem.swap-target{ background:rgba(120,255,150,.18); box-shadow:0 0 0 2px #78ff96; }
  #editList .swapBtn{ margin-left:8px; background:rgba(255,210,77,.15); color:#ffd24d; border:1px solid rgba(255,210,77,.5); }
  #editList .uploadBtn, #editList .swapBtn{ padding:6px 8px; border-radius:8px; font-size:12px; cursor:pointer; }
  .eitem { display:flex; align-items:center; gap:10px; background:#1c1c2e; border-radius:8px;
    padding:8px 10px; margin-bottom:8px; }
  .eitem .thumb { width:46px; height:46px; border-radius:6px; background:#333 center/cover no-repeat; flex:0 0 auto; }
  .eitem .fields { flex:1; display:flex; flex-direction:column; gap:6px; }
  .eitem input { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:5px;
    color:#fff; font-size:12px; padding:6px 8px; width:100%; }
  .eitem input::placeholder{ color:rgba(255,255,255,.35); }
  .eitem .row2 { display:flex; gap:6px; }
  .eitem .uploadBtn { flex:0 0 auto; background:rgba(255,107,157,.18); color:#ff9db9; border:1px dashed rgba(255,107,157,.5);
    border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; white-space:nowrap; }
  .eitem .upTip { font-size:10px; color:rgba(255,255,255,.35); }
  .panelHint { color:rgba(255,255,255,.45); font-size:11px; line-height:1.6; margin:-4px 0 12px; }
  .musicBar { display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:8px 10px;
    background:#1c1c2e; border-radius:8px; }
  .musicLabel { color:#fff; font-size:12px; flex:1; }
  .musicBar button { background:rgba(255,107,157,.18); color:#ff9db9; border:1px dashed rgba(255,107,157,.5);
    border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer; }
  .musicStatus { color:rgba(255,255,255,.5); font-size:10px; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #saveBtn { margin-top:12px; padding:13px; border:none; border-radius:10px; cursor:pointer;
    background:linear-gradient(90deg,#ff6b9d,#ff9d5c); color:#fff; font-size:16px; font-weight:700; letter-spacing:.12em; }
  #photoEditBtn { position:absolute; right:14px; bottom:90px; z-index:25; background:rgba(0,0,0,.6); color:#fff;
    border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:6px 14px; font-size:12px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">

  <!-- 开场 -->
  <div id="cover">
    <div class="title">七夕快乐</div>
    <div class="sub">我 · 爱 · 你</div>
    <div class="enter" id="btnEnter">开 始</div>
    <div class="hint">点一下 “开始” 有惊喜</div>
  </div>

  <!-- 烟花 -->
  <canvas id="fireworks"></canvas>

  <!-- 主场景 -->
  <div id="stage">
    <div id="bg">
      <div id="bgSlide"></div>
      <div id="bgStage"><div id="phaseText"><div id="phaseLabel">相知</div><div id="phaseSub">慢慢靠近你</div></div></div>
    </div>
    <div id="miniStage">❤ 我们的故事</div>
    <div id="ground">
      <div id="grass"></div>
      <div id="track"></div>
    </div>
    <div id="runLayer"></div>
    <div id="editHint">轻触左右 ◀ ▶ 可前后走动</div>
    <button id="photoEditBtn">✏ 编辑照片</button>

    <!-- 控制栏 -->
    <div id="ctrl">
      <div class="row">
        <div class="ctrlBtn" id="btnPrev">◀</div>
        <div class="ctrlBtn" id="btnPause">⏸</div>
        <div class="ctrlBtn" id="btnNext">▶</div>
        <div class="ctrlBtn" id="btnMusic" title="音乐开关">🎵</div>
        <div id="progress"><div id="barFill"></div></div>
        <div id="timeTxt">0 / 30</div>
      </div>
    </div>
  </div>

  <!-- 编辑面板 -->
  <div id="editPanel">
    <div class="head"><h3>编辑照片</h3><span class="close" id="panelClose">关闭</span></div>
    <div class="panelHint">①点击「📷上传」可从相册选择这张照片（保存在本机，刷新不丢）<br>②填写日期和地点后点「保存」<br>③点「🔁互换」可交换两张照片的顺序</div>
    <div id="swapTip" style="display:none; color:#ffd24d; font-size:12px; padding:6px 2px; text-align:center;"></div>
    <div class="musicBar">
      <span class="musicLabel">🎵 背景音乐：</span>
      <button id="musicUploadBtn">上传</button>
      <input type="file" id="musicFile" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg" style="display:none">
      <span class="musicStatus" id="musicStatus">未上传</span>
    </div>
    <div id="editList"></div>
    <button id="saveBtn">保存</button>
  </div>

</div>

<script>
/* =========================================================
   数据配置区 —— 老大在这里填写照片信息（无需改代码）
   photo: 图片文件名（如 01.jpg）。系统会先尝试根目录，再尝试 photos/ 子文件夹（都找不到则用占位图）
   date:  日期文字
   place: 地点文字
   ========================================================= */
var PHOTO_INFO = [
  { photo:"01.jpg",  date:"", place:"" },
  { photo:"02.jpg",  date:"", place:"" },
  { photo:"03.jpg",  date:"", place:"" },
  { photo:"04.jpg",  date:"", place:"" },
  { photo:"05.jpg",  date:"", place:"" },
  { photo:"06.jpg",  date:"", place:"" },
  { photo:"07.jpg",  date:"", place:"" },
  { photo:"08.jpg",  date:"", place:"" },
  { photo:"09.jpg",  date:"", place:"" },
  { photo:"10.jpg",  date:"", place:"" },
  { photo:"11.jpg",  date:"", place:"" },
  { photo:"12.jpg",  date:"", place:"" },
  { photo:"13.jpg",  date:"", place:"" },
  { photo:"14.jpg",  date:"", place:"" },
  { photo:"15.jpg",  date:"", place:"" },
  { photo:"16.jpg",  date:"", place:"" },
  { photo:"17.jpg",  date:"", place:"" },
  { photo:"18.jpg",  date:"", place:"" },
  { photo:"19.jpg",  date:"", place:"" },
  { photo:"20.jpg",  date:"", place:"" },
  { photo:"21.jpg",  date:"", place:"" },
  { photo:"22.jpg",  date:"", place:"" },
  { photo:"23.jpg",  date:"", place:"" },
  { photo:"24.jpg",  date:"", place:"" },
  { photo:"25.jpg",  date:"", place:"" },
  { photo:"26.jpg",  date:"", place:"" },
  { photo:"27.jpg",  date:"", place:"" },
  { photo:"28.jpg",  date:"", place:"" },
  { photo:"29.jpg",  date:"", place:"" },
  { photo:"30.jpg",  date:"", place:"" }
];

// 从 localStorage 载入已编辑的照片信息（含 photo 文件名、date、place；支持换序后刷新保留）
try{
  var saved = JSON.parse(localStorage.getItem("qixi_photo_info")||"null");
  if(saved && saved.length===PHOTO_INFO.length){
    for(var si=0;si<PHOTO_INFO.length;si++){
      if(saved[si]){
        PHOTO_INFO[si] = { photo: saved[si].photo||PHOTO_INFO[si].photo,
                           date: saved[si].date||"",
                           place: saved[si].place||"" };
      }
    }
  }
}catch(e){}

/* 方案A：手机本地上传的照片库（base64 存 localStorage），key=照片序号 */
var SAVED_IMGS = {};   // { 序号: "data:image/...;base64,..." }
try{
  var simg = JSON.parse(localStorage.getItem("qixi_photo_imgs")||"null");
  if(simg && typeof simg==="object"){ SAVED_IMGS = simg; }
}catch(e){}

/* 方案A扩展：手机上传的背景音乐（base64 存 localStorage key: qixi_music），优先于默认内置音乐 */
var SAVED_MUSIC = null;   // "data:audio/...;base64,..."（手机上传，优先）
try{
  SAVED_MUSIC = localStorage.getItem("qixi_music")||null;
}catch(e){}

/* 默认内置背景音乐：同源文件 music/bg.mp3（与页面一起部署，页面能打开它就能播）
   只要有人在页面里上传过音乐，就以手机上传的为准（SAVED_MUSIC 优先）。 */
var DEFAULT_MUSIC_URL = "music/bg.mp3";

/* =========================================================
   阶段背景文字（只用于显示文字，不控制背景）
   ========================================================= */
var PHASES = [
  { name:"相知", sub:"慢慢靠近你",  color:"linear-gradient(180deg,#2c4a8a,#6a70c9)" },
  { name:"相恋", sub:"心动的甜蜜",  color:"linear-gradient(180deg,#c0392b,#e08b3c)" },
  { name:"相爱", sub:"此生挚爱",    color:"linear-gradient(180deg,#8e1e54,#d4386e)" },
  { name:"我们结婚啦", sub:"执子之手", color:"linear-gradient(180deg,#7b1fa2,#e0245e)" },
  { name:"我们有宝宝啦", sub:"爱的小家", color:"linear-gradient(180deg,#f2c94c,#f2994a)" }
];

/* 自然风光背景轮播图（一路变换，不管阶段；Unsplash 免费图床直链） */
var NATURE_BGS = [
  "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=75",
  "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=75",
  "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=75",
  "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=75",
  "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=75",
  "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=75"
];

/* =========================================================
   常量
   ========================================================= */
var TOTAL = 30;               // 照片数量
var PHOTO_W = 150;            // 照片宽度 px（build 时根据屏幕计算）
var GAP = 150;                // 照片间距 px（build 时根据屏幕计算，默认等于半屏）
var BOUNCE = 16;              // 弹跳幅度 px
var SPEED = 170;              // 跑道滚动速度 px/s
var BOUNCE_SPEED = 2.6;       // 弹跳频率

// build 时按屏幕宽度计算：照片宽约为屏宽 42%，相邻照片间距约为半屏
var vw = function(){ return window.innerWidth||360; };
var PHOTO_W_PX = 0;           // 计算后的照片宽带
var GAP_PX = 0;               // 计算后的照片间距

var state = {
  running:false,   // 是否滚动
  phase:0,         // 背景阶段索引
  startTs:0,       // 本次滚动开始时间
  span:0           // 本次滚动的总时长 ms
};
var el = {};

function $(id){ return document.getElementById(id); }

/* =========================================================
   初始化 DOM
   ========================================================= */
function build(){
  // 动态尺寸：照片宽约屏宽 30%（避免照片过高伸进上方背景），间距约半屏
  var W = window.innerWidth||360;
  PHOTO_W_PX = Math.round(W*0.30);
  GAP_PX = Math.round(W*0.50);
  el = {
    cover:$("cover"), buttons:$("btnEnter"), fireworks:$("fireworks"),
    stage:$("stage"), bg:$("bg"), phaseLabel:$("phaseLabel"), phaseSub:$("phaseSub"),
    miniStage:$("miniStage"), runLayer:$("runLayer"),
    barFill:$("barFill"), timeTxt:$("timeTxt"),
    btnPrev:$("btnPrev"), btnPause:$("btnPause"), btnNext:$("btnNext"), btnMusic:$("btnMusic"),
    progress:$("progress"),
    editPanel:$("editPanel"), editList:$("editList"),
    panelClose:$("panelClose"), saveBtn:$("saveBtn"), photoEditBtn:$("photoEditBtn"),
    musicUploadBtn:$("musicUploadBtn"), musicFile:$("musicFile"), musicStatus:$("musicStatus")
  };

  // 生成跑道上的照片
  // 照片加载：优先本地上传(local)→根目录 fn→photos/fn→photos/fnsvg 占位。
  // 兼顾「照片放根目录」与「照片放 photos/ 子目录」两种部署方式。
  function loadPhoto(el_, fn, fnsvg, local){
    if(local){ el_.style.backgroundImage="url("+local+")"; return; }  // 本地上传
    var tries = [fn, "photos/"+fn];
    var svgFallback = "photos/"+fnsvg;
    var cur = 0;
    var img = new Image();
    img.onload = function(){ el_.style.backgroundImage="url("+tries[cur]+")"; };
    img.onerror = function(){
      if(cur < tries.length-1){ cur++; img.src = tries[cur]; }
      else { el_.style.backgroundImage="url("+svgFallback+")"; }
    };
    img.src = tries[0];
  }
  for(var i=0;i<TOTAL;i++){
    var info = PHOTO_INFO[i] || {};
    var div = document.createElement("div");
    div.className="ph";
    div.dataset.idx = i;
    var fn = (info.photo||"01.jpg");
    var fnsvg = fn.replace(/\.[a-z0-9]+$/i, ".svg");
    var imgEl = document.createElement("div");
    imgEl.className="img";
    imgEl.dataset.idx = i;
    loadPhoto(imgEl, fn, fnsvg, SAVED_IMGS[i]||null);
    var cap = document.createElement("div");
    cap.className="cap";
    cap.innerHTML='<b>'+ (info.date||"") +'</b><span>'+ (info.place||"") +'</span>';
    div.appendChild(imgEl);
    div.appendChild(cap);
    // 按顺序排列：left = i*(照片宽+间距)，默认图片宽、间距均用内联覆盖
    div.style.width = PHOTO_W_PX+"px";
    div.style.left = (i*(PHOTO_W_PX+GAP_PX))+"px";
    el.runLayer.appendChild(div);
  }

  // 编辑面板列表
  for(var j=0;j<TOTAL;j++){
    var info2 = PHOTO_INFO[j] || {};
    var fn2 = (info2.photo||"01.jpg");
    var fnsvg2 = fn2.replace(/\.[a-z0-9]+$/i, ".svg");
    var it = document.createElement("div");
    it.className="eitem";
    var thumb = document.createElement("div");
    thumb.className="thumb";
    loadPhoto(thumb, fn2, fnsvg2, SAVED_IMGS[j]||null);
    var fields = document.createElement("div");
    fields.className="fields";
    fields.innerHTML=
        '<input class="ed-date" placeholder="日期，如 2020.5.20" value="'+ (info2.date||"") +'">'+
        '<div class="row2"><input class="ed-place" placeholder="地点，如 广州塔" value="'+ (info2.place||"") +'"></div>'+
        '<div class="row2"><button class="uploadBtn" data-up="'+j+'">📷 上传</button><button class="swapBtn" data-swap="'+j+'">🔁 互换</button></div>';
    // 隐藏的 file input，方案A：支持手机直接从相册选图
    var fileIn = document.createElement("input");
    fileIn.type="file"; fileIn.accept="image/*"; fileIn.style.display="none";
    fileIn.dataset.up = j;
    it.appendChild(thumb);
    it.appendChild(fields);
    it.appendChild(fileIn);
    el.editList.appendChild(it);
  }

  el.bg.style.background = PHASES[0].color;
  el.phaseSub.textContent = PHASES[0].sub;
}

/* =========================================================
   开场 + 烟花
   ========================================================= */
var fctx, CW, CH, parts=[], spawnQueue=0, fwActive=false;
function fwInit(){
  el.fireworks.width = CW = window.innerWidth;
  el.fireworks.height = CH = window.innerHeight;
  fctx = el.fireworks.getContext("2d");
}
function fwSpawn(count){
  spawnQueue += count;
}
function fwLoop(){
  if(!fwActive) return;   // 已停止：不再继续调度（避免和跑道动画双重 RAF 并行）
  if(spawnQueue>0){ parts.push(makeBurst()); spawnQueue--; update(); }
  if(Math.random()<0.04 && parts.length<30) parts.push(makeBurst());
  update();
  requestAnimationFrame(fwLoop);
}
function makeBurst(){
  var x = CW*(0.15+Math.random()*0.7);
  var y = CH*(0.1+Math.random()*0.35);
  var colors=["#ffe066","#ff9db9","#7ee0ff","#b8ff7e","#ffd7a8","#e0b3ff"];
  var c=colors[Math.floor(Math.random()*colors.length)];
  var n = 50+Math.floor(Math.random()*35);
  var base = [];
  for(var i=0;i<n;i++){
    var ang=Math.random()*Math.PI*2, sp=1.5+Math.random()*3.5;
    base.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-0.5,g:0.045,life:60+Math.random()*30,c:c});
  }
  return {x:x,y:y,base:base,life:140};
}
function update(){
  fctx.clearRect(0,0,CW,CH);
  fctx.globalCompositeOperation="lighter";
  for(var b=parts.length-1;b>=0;b--){
    var bl = parts[b];
    bl.life--;
    if(bl.life<=0){ parts.splice(b,1); continue; }
    var alpha = Math.min(1, bl.life/60);
    for(var i=0;i<bl.base.length;i++){
      var p=bl.base[i];
      p.vx*=0.985; p.vy*=0.985; p.vy+=p.g;
      p.x+=p.vx; p.y+=p.vy; p.life--;
      if(p.life<=0) continue;
      // 渐变尾巴
      fctx.globalAlpha=alpha;
      fctx.beginPath();
      fctx.arc(p.x,p.y,1.6,0,Math.PI*2);
      fctx.fillStyle=p.c;
      fctx.fill();
    }
  }
  fctx.globalAlpha=1;
  fctx.globalCompositeOperation="source-over";
}

function startShow(){
  // 在本次真实用户点击（「开始」）手势内直接真正播放音乐
  //（移动端/微信 WebView 只允许在用户点击等真实手势内播放音频）
  musicPlay();   // 点「开始」立即开播

  // 开场：全屏烟花约 3 秒
  fwInit(); fwActive=true; fwLoop();
  var t=0;
  var iv=setInterval(function(){
    fwSpawn(3);
    t+=1;
    if(t>=2.8){
      clearInterval(iv);
      // 淡出封面，进入操场（照片开始动）
      el.cover.style.opacity="0";
      setTimeout(function(){
        el.cover.style.display="none";
        el.stage.style.display="block";
        startRun();
      },1100);
    }
  },220);
}

/* =========================================================
   跑道滚动 + 相片弹跳前进（单一动画循环）
   ========================================================= */
var totalDist, elapsed=0, prevTs=0, playing=false, animId=null, bgSlideTimer=null, bgSlideIdx=0;

function startBgSlide(){
  var wrap = document.getElementById("bgSlide");
  if(!wrap || wrap.children.length>0) return;  // 已初始化
  // 预建所有 slide 层
  for(var i=0;i<NATURE_BGS.length;i++){
    var d=document.createElement("div");
    d.className="slide"+(i===0?" on":"");
    d.style.backgroundImage="url('"+NATURE_BGS[i]+"')";
    wrap.appendChild(d);
  }
  bgSlideIdx=0;
  if(bgSlideTimer) clearInterval(bgSlideTimer);
  bgSlideTimer=setInterval(function(){
    var slides=wrap.children; if(slides.length===0) return;
    var next=(bgSlideIdx+1)%slides.length;
    slides[next].style.opacity="1";         // 新图淡入
    slides[bgSlideIdx].style.opacity="0";   // 旧图淡出
    bgSlideIdx=next;
  },6000);
}

function startRun(){
  // 停掉烟花，清空画面
  fwActive=false; parts.length=0; spawnQueue=0;
  if(fctx) fctx.clearRect(0,0,CW,CH);
  el.fireworks.style.display="none";
  startBgSlide();  // 启动自然风光背景轮播
  musicPlay();     // 进入操场后自动播放背景音乐（已有则播）
  totalDist = TOTAL*(PHOTO_W_PX+GAP_PX) + window.innerWidth + PHOTO_W_PX;
  state.span = totalDist/SPEED*1000;
  elapsed=0; playing=true;
  el.btnPause.textContent="⏸";
  prevTs=performance.now();
  // 启动跑道动画：先取消可能残留的旧帧，再同步执行第一帧（loop 内部会自行 requestAnimationFrame 续命）
  // 用“同步 loop() 踢一帧”的方式（与点步进按钮 setFrac 的成功路径完全一致），规避手机 RAF 首次不调度问题
  if(animId!=null){ cancelAnimationFrame(animId); animId=null; }
  loop(performance.now());
}
function loop(now){
  var dt = now - prevTs;
  prevTs = now;
  if(playing){
    elapsed += dt;
    if(elapsed>state.span) elapsed = state.span; // 到底后停住，背景定格最后一阶段
    var frac = Math.min(1, elapsed/state.span);
    var dist = SPEED*elapsed/1000;
    // 初始把第一张放到界面最右边（INIT_OFFSET 右移），再随时间向左推进
    var INIT_OFFSET = window.innerWidth - PHOTO_W_PX;
    el.runLayer.style.transform="translateX("+(INIT_OFFSET - dist)+"px)";
    // 相片弹跳
    var els = el.runLayer.children;
    for(var i=0;i<els.length;i++){
      var bounce = Math.abs(Math.sin((elapsed/1000)*BOUNCE_SPEED + i*1.7)) * BOUNCE;
      els[i].style.bottom = bounce+"px";
    }
    updatePhase(frac);
    // 进度条
    el.barFill.style.width=(frac*100)+"%";
    el.timeTxt.textContent = (Math.min(TOTAL-1,Math.floor(frac*TOTAL))+1)+" / "+TOTAL;
    if(frac>=1){ elapsed=0; }  // 滚到终点后自动回到起点，无限循环播放
  }
  animId=requestAnimationFrame(loop);
}
function getFrac(){ return Math.min(1, elapsed/state.span); }
function setFrac(frac){
  elapsed = Math.max(0,Math.min(1,frac))*state.span;
  playing=true; el.btnPause.textContent="⏸";
  // 立即刷新一帧
  var now=performance.now(); prevTs=now; loop(now);
}
function updatePhase(frac){
  var f = frac*TOTAL;
  var ph = Math.min(PHASES.length-1, Math.floor(f/5));
  if(ph!==state.phase && ph<PHASES.length){
    state.phase=ph;
    var p=PHASES[ph];
    // 背景由自然风光轮播统一控制，这里只改阶段文字
    el.phaseLabel.textContent=p.name;
    el.phaseSub.textContent=p.sub;
    el.miniStage.innerHTML="❤ "+p.name + (p.sub?" · "+p.sub:"");
  }
}

/* =========================================================
   交互控制
   ========================================================= */
function tapPause(){
  if(playing){ playing=false; el.btnPause.textContent="▶"; }
  else { playing=true; el.btnPause.textContent="⏸"; prevTs=performance.now(); }
}
function step(dir){
  var nf = Math.max(0,Math.min(1, getFrac() + dir/TOTAL));
  setFrac(nf);
}
/* （事件绑定统一放到文件底部 build() 之后执行，避免 build 前 el 为空导致报错） */

/* =========================================================
   照片互换（⚪ 交换两张照片在跑道上的顺序）
   ========================================================= */
var swapState = { active:false, from:-1 };
function swapTipEl(){ return document.getElementById("swapTip"); }
function clearSwapHighlight(){
  var items = el.editList.children;
  for(var i=0;i<items.length;i++){ items[i].classList.remove("swap-sel"); items[i].classList.remove("swap-target"); }
}
function beginSwap(idx){
  // 若已在选择模式且点了同一张，视为取消
  if(swapState.active && swapState.from===idx){ cancelSwap(); return; }
  swapState.active = true;
  swapState.from = idx;
  clearSwapHighlight();
  var items = el.editList.children;
  if(items[idx]) items[idx].classList.add("swap-sel");
  var tip = swapTipEl();
  if(tip){ tip.style.display="block"; tip.textContent = "再点另一张照片完成互换（点同一张或「关闭」取消）"; }
}
function cancelSwap(){
  swapState.active=false; swapState.from=-1;
  clearSwapHighlight();
  var tip = swapTipEl();
  if(tip) tip.style.display="none";
}
function rebuildSwapVisuals(a,b){
  var cards = el.runLayer.children;
  var items = el.editList.children;
  // 交换互换顺序后，跑道两张照片的 left、背景图、caption、编辑面板缩略图与输入框均应反映新数据
  // 1) 跑道：互换两张照片的 left（顺序）
  var la = cards[a].style.left, lb = cards[b].style.left;
  cards[a].style.left = lb; cards[b].style.left = la;
  // 2) 跑道背景图
  var imA = cards[a].querySelector(".img"), imB = cards[b].querySelector(".img");
  var ba = imA.style.backgroundImage, bb = imB.style.backgroundImage;
  imA.style.backgroundImage = bb; imB.style.backgroundImage = ba;
  // 3) 跑道 caption（日期/地点）
  cards[a].querySelector(".cap").innerHTML = '<b>'+(PHOTO_INFO[a].date||"")+'</b><span>'+(PHOTO_INFO[a].place||"")+'</span>';
  cards[b].querySelector(".cap").innerHTML = '<b>'+(PHOTO_INFO[b].date||"")+'</b><span>'+(PHOTO_INFO[b].place||"")+'</span>';
  // 4) 编辑面板缩略图
  var thA = items[a].querySelector(".thumb"), thB = items[b].querySelector(".thumb");
  var tbA = thA.style.backgroundImage, tbB = thB.style.backgroundImage;
  thA.style.backgroundImage = tbB; thB.style.backgroundImage = tbA;
  // 5) 编辑面板日期/地点输入框
  var va = items[a], vb = items[b];
  var da = va.querySelector(".ed-date").value, pa = va.querySelector(".ed-place").value;
  var db = vb.querySelector(".ed-date").value, pb = vb.querySelector(".ed-place").value;
  vb.querySelector(".ed-date").value = da; vb.querySelector(".ed-place").value = pa;
  va.querySelector(".ed-date").value = db; va.querySelector(".ed-place").value = pb;
}
function performSwap(a,b){
  if(a===b){ cancelSwap(); return; }
  // 1) 交换 PHOTO_INFO 整块（photo+date+place）
  var t = PHOTO_INFO[a];
  PHOTO_INFO[a] = PHOTO_INFO[b];
  PHOTO_INFO[b] = t;
  // 2) 交换本地上传图（SAVED_IMGS 按序号）
  var hasA = SAVED_IMGS.hasOwnProperty(a);
  var hasB = SAVED_IMGS.hasOwnProperty(b);
  var tmpIm = SAVED_IMGS[a];
  if(hasB) SAVED_IMGS[a] = SAVED_IMGS[b]; else { delete SAVED_IMGS[a]; }
  if(hasA) SAVED_IMGS[b] = tmpIm; else { delete SAVED_IMGS[b]; }
  // 3) 持久化
  try{ localStorage.setItem("qixi_photo_info", JSON.stringify(PHOTO_INFO)); }catch(e){}
  try{ localStorage.setItem("qixi_photo_imgs", JSON.stringify(SAVED_IMGS)); }catch(e){}
  // 4) 更新显示并退出选择模式
  rebuildSwapVisuals(a,b);
  cancelSwap();
  var tip = swapTipEl();
  if(tip){ tip.style.display="block"; tip.textContent = "✅ 已交换第 "+(a+1)+" 和第 "+(b+1)+" 张，点「保存」后刷新即生效"; }
}

/* =========================================================
   编辑面板
   ========================================================= */
function openPanel(){
  el.editPanel.style.display="flex";
}
function closePanel(){
  cancelSwap(); // 关闭时退出互换选择模式
  var items=el.editList.children;
  var cards=el.runLayer.children;
  for(var i=0;i<items.length;i++){
    var d=items[i].querySelector(".ed-date").value;
    var p2=items[i].querySelector(".ed-place").value;
    var cap=cards[i].querySelector(".cap");
    cap.innerHTML='<b>'+d+'</b><span>'+p2+'</span>';
    // 同步内存配置
    PHOTO_INFO[i].date=d; PHOTO_INFO[i].place=p2;
  }
  // 持久化到本地
  try{ localStorage.setItem("qixi_photo_info", JSON.stringify(PHOTO_INFO)); }catch(e){}
  el.editPanel.style.display="none";
}

/* =========================================================
   方案A：手机本地上传照片
   ========================================================= */
function handleImgUpload(idx, input){
  var f = input && input.files && input.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var dataUrl = ev.target.result;
    SAVED_IMGS[idx] = dataUrl;
    // 持久化（注意：30 张 base64 加起来可能较大，捕获超限异常）
    try{ localStorage.setItem("qixi_photo_imgs", JSON.stringify(SAVED_IMGS)); }catch(e){
      alert("本机存储空间不足，可能存不下这么多高清照片。建议用电脑端上传到 photos 文件夹更靠谱。");
    }
    // 立即应用到跑道照片 + 编辑面板缩略图
    var runImgs = el.runLayer.querySelectorAll(".img");
    if(runImgs[idx]) runImgs[idx].style.backgroundImage="url("+dataUrl+")";
    var th = el.editList.children[idx] && el.editList.children[idx].querySelector(".thumb");
    if(th) th.style.backgroundImage="url("+dataUrl+")";
  };
  reader.readAsDataURL(f);
}
function bindUploads(){
  var btns = el.editList.querySelectorAll(".uploadBtn");
  for(var i=0;i<btns.length;i++){
    (function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-up"),10);
        var fileIn = btn.closest(".eitem").querySelector("input[type=file]");
        if(fileIn) fileIn.click();
      });
    })(btns[i]);
    // input change 事件
    var fileIn = el.editList.children[i] && el.editList.children[i].querySelector("input[type=file]");
    if(fileIn){
      (function(fi){
        fi.addEventListener("change", function(){
          handleImgUpload(parseInt(fi.getAttribute("data-up"),10), fi);
        });
      })(fileIn);
    }
  }
}

/* =========================================================
   方案A扩展：背景音乐（手机上传播放）
   ========================================================= */
var bgAudio = null;      // 唯一音频对象
var musicLoaded = false; // 是否已初始化音频
function ensureMusic(){
  if(musicLoaded) return;
  musicLoaded = true;
  try{
    if(SAVED_MUSIC){
      // 优先：手机上传的音乐（本地 base64，离线也能播）
      bgAudio = new Audio(SAVED_MUSIC);
    } else {
      // 默认内置：同源 music/bg.mp3（随页面部署，人人可听）
      bgAudio = new Audio(DEFAULT_MUSIC_URL);
    }
    bgAudio.loop = true;
    bgAudio.preload = "auto";
  }catch(e){ bgAudio=null; }
}
function musicPlay(){
  ensureMusic();
  if(!bgAudio) return;
  // 浏览器要求用户交互后才能播放；这里由点击开始/点击音乐触发，满足条件
  var p = bgAudio.play();
  if(p && p.catch) p.catch(function(){ /* 忽略自动播放被拦截 */ });
  el.btnMusic.textContent = "🎵";
}
function musicStop(){
  if(bgAudio) bgAudio.pause();
  el.btnMusic.textContent = "🎵";
}
function musicToggle(){
  ensureMusic();
  if(!bgAudio){ alert("音乐加载失败，请尝试上传一首背景音乐（✏ 编辑照片 → 背景音乐 → 上传）"); return; }
  if(bgAudio.paused){ musicPlay(); }
  else { musicStop(); }
}
function handleMusicUpload(input){
  var f = input && input.files && input.files[0];
  if(!f) return;
  if(!/\/audio/.test(f.type) && !/\.(mp3|m4a|aac|wav|ogg|flac)$/i.test(f.name)){
    alert("请选择音频文件（mp3/m4a/wav 等）");
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev){
    SAVED_MUSIC = ev.target.result;
    try{ localStorage.setItem("qixi_music", SAVED_MUSIC); }catch(e){
      alert("音乐文件可能太大，本机存不下。建议选一首短一点的 mp3（几 MB 内）。"); return;
    }
    // 重置音频并立即播放试试
    musicLoaded = false; bgAudio = null; ensureMusic();
    el.musicStatus.textContent = f.name;
    musicPlay();
  };
  reader.readAsDataURL(f);
}
function refreshMusicStatus(){
  if(!el.musicStatus) return;
  el.musicStatus.textContent = SAVED_MUSIC ? "已上传 ✓" : "使用默认内置";
}

/* =========================================================
   启动
   ========================================================= */
build();

// 所有事件绑定必须在 build() 之后，否则 el 还是空对象会抛错
el.progress.addEventListener("click",function(e){
  var r=this.getBoundingClientRect();
  var frac=(e.clientX-r.left)/r.width;
  setFrac(frac);
});
el.btnPrev.addEventListener("click",function(){ step(-1); });
el.btnNext.addEventListener("click",function(){ step(1); });
el.btnPause.addEventListener("click",tapPause);
el.buttons.addEventListener("click",startShow);
el.photoEditBtn.addEventListener("click",openPanel);
el.panelClose.addEventListener("click",closePanel);
el.saveBtn.addEventListener("click",closePanel);
el.btnMusic.addEventListener("click",musicToggle);
el.musicUploadBtn.addEventListener("click",function(){ el.musicFile.click(); });
el.musicFile.addEventListener("change",function(){ handleMusicUpload(el.musicFile); });
bindUploads();
// 照片互换按钮绑定（build 后元素已存在）
(function(){
  var sw = el.editList.querySelectorAll(".swapBtn");
  for(var k=0;k<sw.length;k++){
    (function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-swap"),10);
        if(!swapState.active){ beginSwap(idx); }
        else { performSwap(swapState.from, idx); }
      });
    })(sw[k]);
  }
})();
refreshMusicStatus();
</script>
